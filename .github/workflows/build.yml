name: Build Screen App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Step 1: Get your repo files
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Build the C++ project with g++
    - name: Build with g++
      shell: cmd
      run: g++ main.cpp WindowInitiator.cpp ColorHandler.cpp -o Screen.exe -mwindows

    # Step 3: Upload the compiled .exe as an artifact
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenApp
        path: Screen.exe
